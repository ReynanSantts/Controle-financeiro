<!doctype html>
<html lang="pt">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="login.css" />
    <title>Tela de login</title>
  </head>
  <body>
    <main class="content">
      <section class="left-side">
        <div class="containt-left">
          <div class="title-left-side">
            <h5>PAINEL DE DESPESAS</h5>
          </div>
          <div class="sub-title-left">
            <h2>
              Controle seus gastos com<br />
              clareza.
            </h2>
          </div>
          <div class="description-title-left">
            <p>
              Resgistre despesas, acompanhe o total por categoria e gere<br />
              relatorios do seu periodo
            </p>
          </div>

          <div class="Image-left-side">
            <img src="" />
          </div>
        </div>
      </section>

      <section class="right-side">
        <div class="containt-right">
          <form class="form-Login">
            <div class="content-Login">
              <div class="Title-Login">
                <h5>Entrar</h5>
              </div>
              <div class="description-login">
                <p>Entre usando o email e a senha</p>
              </div>
              <div class="Email">
                <label for="email">E-mail</label>
                <input type="email" id="nome" name="email" required />
              </div>
              <div class="Senha">
                <label for="senha">Senha</label>
                <input type="password" id="senha" name="senha" />
              </div>
              <div class="button-Login">
                <button type="submit">Entrar</button>
              </div>
              <div class="Cadastro">
                <p>Ainda não tem Conta? <a href="#">Cadastrar-se</a></p>
              </div>
            </div>
          </form>
        </div>
      </section>
    </main>
  </body>
</html>
